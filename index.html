const PACKDATA={"PACKS": [{"id": "hggsp", "name": "HGGSP · Terminale", "sub": "6 thèmes officiels + méthode de l'épreuve", "chapters": [{"title": "Méthode de l'épreuve (4 h, coefficient 16)", "html": "<h2>L'épreuve écrite</h2><ul><li><b>Durée :</b> 4 heures. <b>Coefficient :</b> 16 pour une spécialité conservée en Terminale.</li><li><b>Deux exercices, à traiter tous les deux :</b> une <b>dissertation</b> (choix entre deux sujets de thèmes différents) et une <b>étude critique d'un ou deux documents</b> (sur un thème différent des deux sujets de dissertation).</li><li>Un seul exercice traité : la note est plafonnée à 10/20.</li><li><b>Croquis ou schéma</b> facultatif : valorisé s'il est présent, sans pénalité s'il est absent.</li><li><b>Bac 2027 :</b> thèmes évaluables 2, 4, 5 et 6 (les thèmes 1 et 3 ne peuvent pas tomber cette année-là). À confirmer auprès de votre professeur.</li></ul><h2>Dissertation : les étapes</h2><ul><li>Analyser le sujet : mots-clés, bornes chronologiques et spatiales, problématique.</li><li>Annonce de plan : 2 ou 3 parties qui répondent à la question, pas un simple catalogue.</li><li>Chaque partie : idée directrice, arguments, <b>exemples précis</b> (dates, lieux, acteurs, chiffres).</li><li>Conclusion : réponse claire à la problématique, ouverture possible.</li></ul><h2>Étude critique de document(s)</h2><ul><li>Présenter : nature, auteur, date, contexte, destinataire, but.</li><li>Analyser : ce que dit le document, comment, et ce qu'il révèle.</li><li>Critiquer : limites, point de vue, ce qu'il ne dit pas. Croiser avec vos connaissances.</li></ul><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thème 1 · De nouveaux espaces de conquête", "html": "<h2>Idées directrices</h2><ul><li>L'espace se conquiert, se partage, se protège : <b>mers et océans</b>, <b>espace extra-atmosphérique</b>, <b>cyberespace</b>, régions polaires.</li><li><b>Mers et océans :</b> Convention de Montego Bay (1982), mer territoriale (12 milles marins), zone économique exclusive (200 milles marins), enjeux de ressources et de routes maritimes.</li><li><b>Espace :</b> Traité de l'espace (1967) : non-appropriation par les États. Montée du « New Space » et des acteurs privés.</li><li><b>Cyberespace :</b> nouvel espace de puissance et de conflit ; exemple : cyberattaques contre l'Estonie (2007) ; notion de souveraineté numérique.</li><li><b>Pôles :</b> Traité sur l'Antarctique (1959) ; l'Arctique, enjeu de ressources et de nouvelles routes avec le recul de la banquise.</li></ul><p><b>À préparer :</b> deux exemples précis par espace, un acteur (État, firme, organisation) et un croquis simple.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thème 2 · Faire la guerre, faire la paix : formes de conflits et modes de résolution", "html": "<h2>Idées directrices</h2><ul><li><b>Formes de conflits :</b> guerres interétatiques, guerre totale, guerre froide, guerres asymétriques, terrorisme, conflits hybrides et cyberconflits.</li><li><b>Modes de résolution :</b> traités de paix, diplomatie, organisations internationales (ONU, 1945), opérations de maintien de la paix, justice internationale.</li><li><b>Repères :</b> Congrès de Vienne (1814-1815) ; traité de Versailles (1919) ; procès de Nuremberg (1945-1946) ; Statut de Rome (1998) et Cour pénale internationale (en activité depuis 2002).</li><li><b>Question centrale :</b> une paix négociée est-elle durable ? Comparer 1815, 1919 et 1945.</li></ul><p><b>À préparer :</b> un conflit récent détaillé (acteurs, causes, tentatives de résolution) et la comparaison de deux traités de paix.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thème 3 · Histoire et mémoires", "html": "<h2>Idées directrices</h2><ul><li><b>Distinguer histoire et mémoire :</b> l'histoire est une démarche critique fondée sur des sources ; la mémoire est un rapport au passé porté par des groupes, parfois concurrents.</li><li><b>Génocides et crimes de masse :</b> reconnaissance, justice, transmission (Shoah, génocide des Arméniens, génocide des Tutsi au Rwanda).</li><li><b>Justice et réconciliation :</b> Nuremberg (1945-1946), tribunaux pénaux internationaux (ex-Yougoslavie 1993, Rwanda 1994), Commission Vérité et Réconciliation en Afrique du Sud (1995).</li><li><b>Mémoire et loi :</b> loi Gayssot (1990), loi Taubira (2001) ; débats sur le rôle de l'État.</li><li><b>Notion :</b> « lieux de mémoire » (Pierre Nora).</li></ul><p><b>À préparer :</b> un cas d'étude complet (faits, justice, mémoire, débats actuels).</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thème 4 · Identifier, protéger et valoriser le patrimoine : enjeux géopolitiques", "html": "<h2>Idées directrices</h2><ul><li><b>Cadre :</b> Convention du patrimoine mondial de l'UNESCO (1972) ; patrimoine culturel immatériel (convention de 2003).</li><li><b>Menaces :</b> destructions volontaires lors des conflits (Bouddhas de Bamiyan, 2001 ; Palmyre, 2015), pillage, trafic, surtourisme, changement climatique.</li><li><b>Enjeux de puissance :</b> patrimoine et identité nationale, tourisme, « soft power », concurrence pour les labels.</li><li><b>Restitutions :</b> débat sur les biens culturels acquis à l'époque coloniale ; rapport Sarr-Savoy (2018).</li></ul><p><b>À préparer :</b> un site classé étudié en détail et un exemple de restitution.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thème 5 · L'environnement, entre exploitation et protection : un enjeu planétaire", "html": "<h2>Idées directrices</h2><ul><li><b>Exploiter ou protéger :</b> énergie, eau, minerais, forêts, océans ; tensions entre croissance et environnement.</li><li><b>Gouvernance internationale :</b> Sommet de la Terre de Rio (1992), protocole de Kyoto (1997), Accord de Paris (COP21, 2015) ; GIEC (créé en 1988).</li><li><b>Acteurs :</b> États, ONG, entreprises, collectivités, citoyens ; justice climatique entre pays.</li><li><b>Notions :</b> Anthropocène, développement durable, transition énergétique, ressources stratégiques.</li><li><b>Fil conducteur :</b> pourquoi est-il si difficile de s'entendre ? Intérêts nationaux, inégalités, urgence.</li></ul><p><b>À préparer :</b> un exemple de ressource disputée (ex. l'eau ou l'Arctique) et un bilan d'un accord international.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thème 6 · L'enjeu de la connaissance", "html": "<h2>Idées directrices</h2><ul><li><b>La connaissance, source de puissance :</b> recherche, innovation, brevets, éducation, numérique.</li><li><b>Inégalités d'accès :</b> fracture numérique, fuite des cerveaux, concentration des savoirs et des données.</li><li><b>Acteurs :</b> États, universités, grandes firmes du numérique, organisations internationales.</li><li><b>Risques :</b> désinformation, contrôle de l'information, protection des données.</li><li><b>Question centrale :</b> qui contrôle la production et la diffusion des connaissances ?</li></ul><p><b>À préparer :</b> deux exemples précis de puissance par la connaissance et un document critique sur l'information.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Ressources officielles", "html": "<h2>Liens utiles</h2><ul><li><a href=\"https://eduscol.education.gouv.fr/5802/programmes-et-ressources-en-histoire-geographie-geopolitique-et-sciences-politiques-voie-g\">Programme et ressources HGGSP (Éduscol)</a></li><li><a href=\"https://eduscol.education.gouv.fr/5706/les-epreuves-terminales-du-baccalaureat-general\">Épreuves terminales du bac général (Éduscol)</a></li><li><a href=\"https://eduscol.education.gouv.fr/5697/dates-des-examens-2027\">Dates des examens 2027 (Éduscol)</a></li></ul><p>Ces liens ouvrent des sites officiels : rien n'est copié ici.</p>"}]}, {"id": "llce", "name": "LLCE Anglais · Terminale", "sub": "3 thématiques + boîte à outils + suivi des œuvres", "chapters": [{"title": "Méthode et vue d'ensemble", "html": "<h2>La spécialité LLCE Anglais</h2><ul><li><b>Trois thématiques :</b> « Arts et débats d'idées », « Expression et création de soi », « Voyages, territoires, frontières ».</li><li><b>Œuvres :</b> 3 œuvres intégrales en Terminale (d'après la plaquette d'un lycée). La liste dépend de votre professeur.</li><li><b>Niveau visé :</b> C1.</li><li>Le format exact de l'épreuve est à confirmer auprès de votre professeur ou sur Éduscol.</li></ul><h2>Entraînement régulier</h2><ul><li>Lire en anglais chaque semaine (articles, nouvelles, extraits).</li><li>Écrire un court essai ou un commentaire par semaine.</li><li>Tenir un carnet de vocabulaire par thématique.</li></ul><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thématique 1 · Arts et débats d'idées", "html": "<h2>Notions clés</h2><ul><li><b>Freedom of expression / censorship:</b> who decides what may be said or shown?</li><li><b>Art as protest:</b> satire, political art, protest songs, street art.</li><li><b>Propaganda and influence:</b> how images and words shape opinion.</li><li><b>Social criticism:</b> inequality, power, class, race, gender.</li><li><b>The artist's role:</b> witness, critic, dreamer.</li></ul><h2>Mots utiles</h2><ul><li>to challenge, to denounce, to defy, to undermine, to promote, to censor, to raise awareness, outspoken, controversial, thought-provoking</li></ul><p><b>À préparer :</b> deux œuvres ou documents par notion, avec une citation courte à retenir.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thématique 2 · Expression et création de soi", "html": "<h2>Notions clés</h2><ul><li><b>Identity:</b> how we define ourselves and are defined by others.</li><li><b>Self-expression:</b> autobiography, diary, self-portrait, voice and style.</li><li><b>Belonging and difference:</b> culture, class, gender, generation.</li><li><b>Creativity:</b> the creative process, inspiration, freedom and constraints.</li><li><b>Becoming:</b> coming-of-age, transformation, turning points.</li></ul><h2>Mots utiles</h2><ul><li>to come to terms with, to reinvent oneself, a sense of belonging, to stand out, to fit in, self-discovery, a voice of one's own, to be torn between</li></ul><p><b>À préparer :</b> un personnage ou un auteur étudié avec son évolution, et un passage clé commenté.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Thématique 3 · Voyages, territoires, frontières", "html": "<h2>Notions clés</h2><ul><li><b>Journeys and exploration:</b> travel writing, quests, discovery.</li><li><b>Migration and exile:</b> leaving, arriving, integration, double culture.</li><li><b>Borders and territories:</b> physical and symbolic frontiers, walls, the idea of home.</li><li><b>Empire and its legacy:</b> colonisation, postcolonial voices, power over land.</li><li><b>The American frontier:</b> myth and reality, expansion.</li></ul><h2>Mots utiles</h2><ul><li>to cross a border, to settle, to uproot, displacement, homeland, to belong, boundary, outsider, a melting pot, a journey of self-discovery</li></ul><p><b>À préparer :</b> un texte ou une œuvre par notion et vos propres exemples d'actualité.</p><p><i>Fiche de départ à compléter avec votre cours et à vérifier avec votre professeur : elle donne les repères, pas le cours complet.</i></p>"}, {"title": "Boîte à outils : commenter et argumenter", "html": "<h2>Analyse littéraire</h2><ul><li><b>Figures:</b> metaphor, simile, irony, understatement, personification, alliteration, repetition, symbol, hyperbole.</li><li><b>Narration:</b> point of view, narrator, tone, atmosphere, structure, time shifts.</li><li><b>Verbes de commentaire:</b> to convey, to suggest, to reveal, to emphasise, to contrast, to evoke.</li></ul><h2>Structurer un essai</h2><ul><li>Introduction : context, text or work, issue and plan.</li><li>Body: one idea per paragraph, with a quotation and an explanation.</li><li>Conclusion: answer to the question, and a wider view.</li></ul><h2>Connecteurs</h2><ul><li>Addition: moreover, besides, in addition.</li><li>Contrast: however, whereas, nevertheless, on the other hand.</li><li>Cause and consequence: because of, as a result, therefore, hence.</li><li>Conclusion: all in all, to sum up, ultimately.</li></ul>"}, {"title": "Mes œuvres (à compléter)", "html": "<h2>Œuvre 1</h2><ul><li>Titre et auteur : </li><li>Époque et contexte : </li><li>Thématique liée : </li><li>Personnages principaux : </li><li>Thèmes et idées : </li><li>Citations à retenir : </li></ul><h2>Œuvre 2</h2><ul><li>Titre et auteur : </li><li>Époque et contexte : </li><li>Thématique liée : </li><li>Personnages principaux : </li><li>Thèmes et idées : </li><li>Citations à retenir : </li></ul><h2>Œuvre 3</h2><ul><li>Titre et auteur : </li><li>Époque et contexte : </li><li>Thématique liée : </li><li>Personnages principaux : </li><li>Thèmes et idées : </li><li>Citations à retenir : </li></ul>"}, {"title": "Ressources officielles", "html": "<h2>Liens utiles</h2><ul><li><a href=\"https://eduscol.education.gouv.fr/5814/programmes-et-ressources-en-langues-litteratures-et-cultures-etrangeres-et-regionales-voie-g\">Programme et ressources LLCER (Éduscol)</a></li><li><a href=\"https://eduscol.education.gouv.fr/5706/les-epreuves-terminales-du-baccalaureat-general\">Épreuves terminales du bac général (Éduscol)</a></li><li><a href=\"https://eduscol.education.gouv.fr/5697/dates-des-examens-2027\">Dates des examens 2027 (Éduscol)</a></li></ul><p>Ces liens ouvrent des sites officiels : rien n'est copié ici.</p>"}]}], "BAC": [{"id": "bac27-philo", "subject": "Philosophie", "title": "Bac 2027 · épreuve écrite (matin)", "date": "2027-06-14", "time": "08:00"}, {"id": "bac27-spe", "subject": "Spécialités", "title": "Bac 2027 · épreuves écrites de spécialité, 16 au 18 juin (le matin)", "date": "2027-06-16", "time": "08:00"}, {"id": "bac27-go", "subject": "Grand oral", "title": "Bac 2027 · Grand oral, 21 juin au 2 juillet", "date": "2027-06-21", "time": ""}]};
function packHas(p){return courses.some(c=>c.pack===p.id)}
function addPack(id){
  const p=PACKDATA.PACKS.find(x=>x.id===id);if(!p||packHas(p))return;
  const cid='c'+uid(),t=nowMs();
  courses.push({id:cid,name:clip(p.name,75),pack:p.id,chapters:p.chapters.map((h,i)=>({id:'h'+uid()+i,title:clip(h.title,130),content:sanitize(h.html),rich:true,files:[],u:t}))});
  selectedCourse=cid;selectedChapter=null;saveCourses();render();toast(L('Programme ajouté à vos cours ♡','Programme added to your courses ♡'))
}
function addBacDates(){
  let n=0;for(const b of PACKDATA.BAC){if(exams.some(e=>e.id===b.id))continue;exams.push({id:b.id,subject:clip(b.subject,70),title:clip(b.title,100),date:b.date,time:b.time,u:nowMs()});n++}
  saveExams();render();toast(n?L('Dates du bac 2027 ajoutées à Agenda › Examens.','2027 baccalauréat dates added to Calendar › Exams.'):L('Ces dates sont déjà dans vos examens.','These dates are already in your exams.'))
}
function packsCard(){
  const hasBac=PACKDATA.BAC.every(b=>exams.some(e=>e.id===b.id));
  return `<div class="sec-head"><h2>${L('programmes <em>prêts à l’emploi.</em>','ready-made <em>programmes.</em>')}</h2></div>
  <div class="course-grid">${PACKDATA.PACKS.map(p=>`<div class="card" style="padding:18px;display:grid;gap:10px"><div><small class="muted" style="letter-spacing:1.2px;text-transform:uppercase;font-weight:700;font-size:11px">${L('Programme','Programme')}</small><strong style="display:block;font:500 22px/1.15 var(--serif);margin-top:4px">${esc(p.name)}</strong><div class="muted" style="font-size:13px;margin-top:4px">${esc(p.sub)}</div></div>${packHas(p)?`<span class="pill grp">${L('Déjà ajouté','Already added')}</span>`:`<button class="btn accent sm" onclick="addPack('${p.id}')">${ic('plus')} ${L('Ajouter à mes cours','Add to my courses')}</button>`}</div>`).join('')}
  <div class="card" style="padding:18px;display:grid;gap:10px"><div><small class="muted" style="letter-spacing:1.2px;text-transform:uppercase;font-weight:700;font-size:11px">${L('Examens','Exams')}</small><strong style="display:block;font:500 22px/1.15 var(--serif);margin-top:4px">${L('Dates du bac 2027','2027 baccalauréat dates')}</strong><div class="muted" style="font-size:13px;margin-top:4px">${L('Philosophie, spécialités, Grand oral','Philosophy, specialty subjects, Grand oral')}</div></div>${hasBac?`<span class="pill grp">${L('Déjà ajouté','Already added')}</span>`:`<button class="btn accent sm" onclick="addBacDates()">${ic('plus')} ${L('Ajouter à mes examens','Add to my exams')}</button>`}</div></div>
  <p class="muted" style="font-size:12px;margin-top:12px">${L('Fiches de départ rédigées à partir des programmes officiels : elles donnent les repères, pas le cours complet. Complétez avec votre cours et vérifiez avec votre professeur. Dates à confirmer sur Éduscol.','Starter sheets written from the official programmes: they give landmarks, not the full course. Complete them with your lessons and check with your teacher. Dates to confirm on Éduscol.')}</p>`}

/* ---- chat v2: fichiers + messages vocaux ---- */
const CHAT_MAX=10*1024*1024,VOICE_MAX=180,CHAT_OK=/^(image\/(jpeg|png|webp|gif)|application\/pdf|text\/plain|audio\/(webm|mp4|mpeg|ogg|aac|x-m4a)|application\/(msword|vnd\.ms-(powerpoint|excel)|vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|presentationml\.presentation|spreadsheetml\.sheet)))$/;
let rec=null,fileURL={};
const chatSize=n=>n>=1048576?(n/1048576).toFixed(1)+' '+L('Mo','MB'):Math.max(1,Math.round(n/1024))+' '+L('Ko','KB');
const chatDur=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const stPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function mediaURL(path,type){
  if(fileURL[path])return fileURL[path];
  const r=await sbFetch('/storage/v1/object/authenticated/chat-files/'+stPath(path));if(!r.ok)throw 0;
  const b=await r.blob();return fileURL[path]=URL.createObjectURL(type?new Blob([b],{type}):b);
}
function chatItem(x,g){
  const mine=x.user_id===(auth&&auth.uid),canDel=mine||g.cown;
  const head=`<div class="muted" style="font-size:11px;display:flex;gap:8px;align-items:center"><span>${esc(x.author||'')} · ${new Date(x.created_at).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'})}</span>${canDel?`<button class="iconbtn" style="width:26px;height:26px;margin-inline-start:auto" aria-label="${L('Supprimer','Delete')}" onclick="chatDel(${x.id})">×</button>`:''}</div>`;
  let body;
  const p=esc(x.file_path||''),t=esc(x.file_type||''),cu=fileURL[x.file_path||''];
  if(x.kind==='voice'&&cu)body=`<div style="margin-top:4px"><audio controls src="${cu}" style="max-width:100%"></audio></div>`;
  else if(x.kind==='file'&&cu&&/^image\//.test(x.file_type||''))body=`<div style="margin-top:4px"><img alt="" src="${cu}" style="max-width:100%;max-height:260px;border-radius:10px;display:block"></div>`;
  else if(x.kind==='voice')body=`<div class="row" style="gap:8px;margin-top:4px"><button class="btn soft sm" data-p="${p}" data-t="${t}" onclick="chatPlay(this)">▶ ${chatDur(x.dur)}</button><span class="muted" style="font-size:12px">${L('Message vocal','Voice message')}</span></div>`;
  else if(x.kind==='file'&&/^image\//.test(x.file_type||''))body=`<div style="margin-top:4px"><button class="btn line sm" data-p="${p}" data-t="${t}" onclick="chatShowImg(this)">🖼 ${esc(x.file_name||'image')} · ${chatSize(x.file_size||0)}</button></div>`;
  else if(x.kind==='file')body=`<div style="margin-top:4px"><button class="btn line sm" data-p="${p}" data-t="${t}" data-n="${esc(x.file_name||'fichier')}" onclick="chatSave(this)">${ic('dl')} ${esc(x.file_name||'fichier')} · ${chatSize(x.file_size||0)}</button></div>`;
  else body=`<div style="white-space:pre-wrap;overflow-wrap:anywhere" dir="auto">${esc(x.body)}</div>`;
  return `<div style="justify-self:${mine?'end':'start'};max-width:86%;background:${mine?'var(--blush)':'var(--beige)'};border-radius:14px;padding:8px 12px">${head}${body}</div>`;
}
const chatHTML=g=>(chatMsgs[g.cloud]||[]).map(x=>chatItem(x,g)).join('');
async function chatPlay(b){b.disabled=true;try{const u=await mediaURL(b.dataset.p,b.dataset.t);const a=document.createElement('audio');a.controls=true;a.autoplay=true;a.src=u;a.style.maxWidth='100%';b.replaceWith(a)}catch(e){b.disabled=false;toast(L('Lecture impossible.','Could not play.'),'err')}}
async function chatShowImg(b){b.disabled=true;try{const u=await mediaURL(b.dataset.p,b.dataset.t);const i=document.createElement('img');i.src=u;i.alt='';i.style.cssText='max-width:100%;max-height:260px;border-radius:10px;display:block';b.replaceWith(i)}catch(e){b.disabled=false;toast(L('Image indisponible.','Image unavailable.'),'err')}}
async function chatSave(b){b.disabled=true;try{const u=await mediaURL(b.dataset.p,b.dataset.t);const a=document.createElement('a');a.href=u;a.download=b.dataset.n||'fichier';document.body.appendChild(a);a.click();a.remove()}catch(e){toast(L('Téléchargement impossible.','Download failed.'),'err')}b.disabled=false}
function chatTab(g){
  if(!signedIn())return `<div class="card empty"><strong>${L('Chat en direct','Live chat')}</strong>${L('Connectez-vous pour discuter en direct avec votre groupe.','Sign in to chat live with your group.')}<div style="margin-top:14px"><button class="btn accent" onclick="accountModal('in')">${L('Me connecter','Sign in')}</button></div></div>`;
  if(!g.cloud)return `<div class="card empty"><strong>${L('Activer le chat en direct','Turn on live chat')}</strong>${L('Un code est créé : vos camarades connectés le saisissent ici pour rejoindre la discussion.','A code is created: signed-in classmates enter it here to join the discussion.')}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn accent" onclick="chatCreate('${g.id}')">${L('Activer pour ce groupe','Turn on for this group')}</button><button class="btn line" onclick="chatJoinForm('${g.id}')">${L('J’ai un code','I have a code')}</button></div></div>`;
  return `<div class="card" style="padding:14px"><div class="row" style="margin-bottom:10px"><span class="pill grp">${L('Code du chat','Chat code')} : <b>${esc(g.ccode||'')}</b></span><button class="btn line sm" onclick="copyText('${esc(g.ccode||'')}')">${ic('copy')} ${L('Copier','Copy')}</button><a class="btn soft sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(L('Rejoins le chat de mon groupe d’étude : ouvre The Study Edit, Groupes, Chat, « J’ai un code » : ','Join my study group chat: open The Study Edit, Groups, Chat, “I have a code”: ')+(g.ccode||''))}">${ic('chat')} WhatsApp</a></div>
  <div id="chatBox" class="chatbox" style="max-height:48vh;overflow:auto;display:grid;gap:8px;padding:6px 2px">${chatHTML(g)||`<p class="muted" style="text-align:center;margin:20px 0">${L('Aucun message. Dites bonjour !','No messages yet. Say hello!')}</p>`}</div>
  <form id="chatForm" class="row" style="margin-top:10px;gap:8px;flex-wrap:nowrap" onsubmit="chatSend(event,'${g.id}')"><label class="iconbtn" style="cursor:pointer" aria-label="${L('Joindre un fichier','Attach a file')}" title="${L('Joindre un fichier ou une photo','Attach a file or photo')}">${ic('clip')}<input type="file" hidden accept="image/*,.pdf,.txt,.doc,.docx,.ppt,.pptx,.xls,.xlsx" onchange="chatAttach(event,'${g.id}')"></label><input id="chatIn" type="text" maxlength="2000" placeholder="${L('Votre message…','Your message…')}" autocomplete="off" style="flex:1;min-width:0"><button type="button" class="iconbtn" aria-label="${L('Message vocal','Voice message')}" title="${L('Message vocal','Voice message')}" onclick="recStart('${g.id}')">🎙</button><button class="btn accent" aria-label="${L('Envoyer','Send')}">${ic('send')}</button></form>
  <div id="recBar" class="row" style="margin-top:10px;gap:10px;display:none"><span style="width:12px;height:12px;border-radius:50%;background:#d12;animation:pulse 1.2s infinite"></span><strong id="recT">0:00</strong><span class="muted grow">${L('Enregistrement…','Recording…')}</span><button class="btn line sm" onclick="recStop(false)">${L('Annuler','Cancel')}</button><button class="btn accent sm" onclick="recStop(true)">${L('Envoyer','Send')}</button></div>
  <p class="muted" style="font-size:11px;margin:8px 0 0">${L('Fichiers : 10 Mo maximum. Vocaux : 3 minutes maximum.','Files: 10 MB max. Voice messages: 3 minutes max.')}</p></div>`;
}
async function chatPoll(){
  const g=openGroup&&getGroup(openGroup);if(!g||!g.cloud||page!=='groups'||gTab!=='chat'||!signedIn()){stopChat();return}
  if(document.hidden||rec)return;
  try{const r=await sbFetch(`/rest/v1/group_messages?group_id=eq.${encodeURIComponent(g.cloud)}&select=id,user_id,author,body,kind,file_path,file_name,file_type,file_size,dur,created_at&order=created_at.desc&limit=100`);if(!r.ok)return;
    const a=(await r.json()).reverse(),old=chatMsgs[g.cloud]||[];
    if(a.length!==old.length||(a.length&&old.length&&a[a.length-1].id!==old[old.length-1].id)){chatMsgs[g.cloud]=a;const b=$('chatBox');if(b){const stick=b.scrollTop+b.clientHeight>=b.scrollHeight-40;b.innerHTML=chatHTML(g);if(stick)b.scrollTop=b.scrollHeight}}
  }catch(e){}
}
function chatStart(){stopChat();chatPoll().then(()=>{const b=$('chatBox');if(b)b.scrollTop=b.scrollHeight});chatTimer=setInterval(chatPoll,3000)}
const chatName=g=>clip(((g.members.find(m=>m.id===g.me)||{}).name||settings.name||auth.name||''),40);
async function chatInsert(g,row){const r=await sbFetch('/rest/v1/group_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(Object.assign({group_id:g.cloud,author:chatName(g)},row))});if(!r.ok)throw 0}
async function chatSend(e,gid){
  e.preventDefault();const g=getGroup(gid),i=$('chatIn'),t=i.value.trim();if(!g||!g.cloud||!t)return;i.value='';
  try{await chatInsert(g,{body:t});await chatPoll();const b=$('chatBox');if(b)b.scrollTop=b.scrollHeight}catch(err){i.value=t;toast(L('Message non envoyé.','Message not sent.'),'err')}
}
async function chatUpload(g,blob,name,type,kind,dur){
  const safe=name.replace(/[^\w.\-]+/g,'_').slice(-60)||'fichier',path=g.cloud+'/'+Date.now().toString(36)+'-'+safe;
  const r=await sbFetch('/storage/v1/object/chat-files/'+stPath(path),{method:'POST',headers:{'Content-Type':type,'x-upsert':'false'},body:blob});if(!r.ok)throw 0;
  await chatInsert(g,{body:clip(name,200)||'fichier',kind,file_path:path,file_name:clip(name,200),file_type:type,file_size:blob.size,dur:dur||null});
  await chatPoll();const b=$('chatBox');if(b)b.scrollTop=b.scrollHeight;
}
async function chatAttach(e,gid){
  const g=getGroup(gid),f=e.target.files[0];e.target.value='';if(!g||!g.cloud||!f)return;
  if(f.size>CHAT_MAX){toast(L('Fichier trop lourd (10 Mo maximum).','File too large (10 MB max).'),'err');return}
  const type=(f.type||'').split(';')[0];if(!CHAT_OK.test(type)){toast(L('Type de fichier non accepté.','File type not accepted.'),'err');return}
  toast(L('Envoi en cours…','Sending…'));
  try{await chatUpload(g,f,f.name,type,'file');toast(L('Fichier envoyé ♡','File sent ♡'))}catch(err){toast(L('Envoi impossible.','Could not send.'),'err')}
}
async function recStart(gid){
  const g=getGroup(gid);if(!g||!g.cloud||rec)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast(L('Enregistrement non pris en charge sur cet appareil.','Recording is not supported on this device.'),'err');return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    const mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined),chunks=[];
    rec={g,mr,st,chunks,t0:Date.now(),send:false};
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{
      const r=rec;rec=null;clearInterval(r.iv);r.st.getTracks().forEach(t=>t.stop());
      $('recBar')&&($('recBar').style.display='none');$('chatForm')&&($('chatForm').style.display='');
      if(!r.send||!r.chunks.length)return;
      const type=(r.mr.mimeType||'audio/webm').split(';')[0],ext=type.includes('mp4')?'m4a':'webm',blob=new Blob(r.chunks,{type}),dur=Math.round((Date.now()-r.t0)/1000);
      if(blob.size>CHAT_MAX){toast(L('Message vocal trop lourd.','Voice message too large.'),'err');return}
      try{await chatUpload(r.g,blob,'vocal-'+dur+'s.'+ext,type,'voice',dur)}catch(e){toast(L('Envoi impossible.','Could not send.'),'err')}
    };
    mr.start();$('chatForm').style.display='none';$('recBar').style.display='flex';$('recT').textContent='0:00';
    rec.iv=setInterval(()=>{const s=Math.round((Date.now()-rec.t0)/1000);const el=$('recT');if(el)el.textContent=chatDur(s);if(s>=VOICE_MAX)recStop(true)},250);
  }catch(e){rec=null;toast(L('Micro inaccessible : autorisez-le dans le navigateur.','Microphone unavailable: allow it in the browser.'),'err')}
}
function recStop(send){if(!rec)return;rec.send=!!send;try{rec.mr.stop()}catch(e){}}
function chatDel(id){
  const g=openGroup&&getGroup(openGroup);if(!g||!g.cloud)return;const m=(chatMsgs[g.cloud]||[]).find(x=>x.id===id);if(!m)return;
  confirmBox(L('Supprimer ce message ?','Delete this message?'),L('Supprimer','Delete'),async()=>{
    try{if(m.file_path){await sbFetch('/storage/v1/object/chat-files/'+stPath(m.file_path),{method:'DELETE'});delete fileURL[m.file_path]}
      const r=await sbFetch('/rest/v1/group_messages?id=eq.'+id,{method:'DELETE'});if(!r.ok)throw 0;
      chatMsgs[g.cloud]=(chatMsgs[g.cloud]||[]).filter(x=>x.id!==id);const b=$('chatBox');if(b)b.innerHTML=chatHTML(g)}catch(e){toast(L('Suppression impossible.','Could not delete.'),'err')}})
}

/* ---------- boot ---------- */
function route(){
  const h=location.hash||'';
  if(h.startsWith('#join=')){handleInvite(h);return}
  let p=h.slice(1);if(p==='prefs')p='settings';if(PAGES.includes(p)||p==='settings'||p==='profile'){page=p}
}
window.addEventListener('hashchange',()=>{const h=location.hash;if(h.startsWith('#join=')){handleInvite(h);return}let p=h.slice(1);if(p==='prefs')p='settings';if((PAGES.includes(p)||p==='settings'||p==='profile')&&p!==page){page=p;openGroup=null;render()}});
route();render();fkeys().then(()=>{if(page==='groups'||page==='courses'||page==='tasks')render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body></html>
